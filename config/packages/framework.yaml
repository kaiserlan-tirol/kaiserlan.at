# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_lifetime: 604800
        storage_factory_id: session.storage.factory.native
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

    #esi: true
    #fragments: true
    php_errors:
        log: true

    property_info:
        enabled: true

    http_client:
        scoped_clients:
            idm_client:
                base_uri: '%env(KLMS_IDM_URL)%'
                auth_basic: '%env(KLMS_IDM_AUTH)%'
                max_redirects: 0
                headers:
                    Accept: 'application/json'
                    X-API-KEY: '%env(KLMS_IDM_APIKEY)%'
                # SSL configuration - can be disabled in dev environments
                verify_peer: '%env(bool:KLMS_IDM_SSL_VERIFY)%'
                verify_host: '%env(bool:KLMS_IDM_SSL_VERIFY)%'
            steam_client:
                base_uri: 'https://api.steampowered.com'
                headers:
                    Accept: 'application/json'
                # The plesk chroot ships no CA store at all, so peer verification
                # cannot succeed there. Accepted deliberately: the command runs
                # rarely and manually. Note the api key travels in the query
                # string, so a MITM on this connection would expose it.
                verify_peer: false
                verify_host: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        http_client:
            mock_response_factory: App\Tests\IdmServerMock
